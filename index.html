);
meals[0].name='Hähnchen-Kartoffel-Bowl';meals[1].name='Rinderhack-Reis-Bowl';meals[2].name='Hähnchen-Skyr-Wraps';meals[3]={name:'Schnelle Hähnchen-Gemüse-Pfanne',kcal:800,p:60,items:[['Frosta-Pfanne',500,'g'],['Hähnchen',150,'g'],['Öl',5,'g']],recipe:'Eine Reis-Gemüse-Pfanne wählen und nach Packung zubereiten. Hähnchen separat vollständig durchgaren und dazugeben. Die Kalorien hängen von der Frosta-Sorte ab: vor dem Tracking Etikett prüfen. Etwa 20 Minuten.'};
function chooseDay(d){selectedDay=d;render()}
function shiftWeek(n){todayOnly=false;week=add(week,n*7);selectedDay=week;render()}
function weekControl(){return `<div class="weekbar"><button onclick="shiftWeek(-1)" aria-label="Vorige Woche">←</button><span>${date(week)} – ${date(add(week,6))} <span class="purple">· Woche ${weekType(week)}</span></span><button onclick="shiftWeek(1)" aria-label="Nächste Woche">→</button><button onclick="showTodayDays()">Heute</button></div>`}
function weekDayOrder(){let start=todayOnly&&week===monday(today())?(new Date(today()+'T12:00:00').getDay()+6)%7:0;return Array.from({length:7-start},(_,i)=>i+start)}
function dayPicker(){if(selectedDay<week||selectedDay>add(week,6))selectedDay=week;return `<div class="day-picker" aria-label="Trainingstag wählen">${weekDayOrder().map(i=>{let n=dayNames[i],d=add(week,i),s=session(d);return `<button aria-pressed="${d===selectedDay}" class="day-tile ${d===selectedDay?'selected':''}" onclick="chooseDay('${d}')"><span>${n}</span><small>${new Date(d+'T12:00:00').getDate()}.${new Date(d+'T12:00:00').getMonth()+1}.</small><em>${s.type==='gym'?'Gym':s.type==='run'?'Laufen':s.type==='bike'?'Rad':'Pause'}${state.done[d]?' ✓':''}</em>${d===today()?'<b>HEUTE</b>':''}</button>`}).join('')}</div>`}
function activityArt(s){if(s.type==='gym')return '<img class="activity-photo" src="assets/gym-cinematic.png" alt="Krafttraining im Fitnessstudio">';if(s.type==='run')return `<div class="running-photo"><img src="assets/joggen-dark.png" alt="Joggen auf einer Straße im Abendlicht"></div>`;if(s.type==='bike')return `<img class="activity-photo" src="${window.ATHLETIC_ASSETS.spinning}" alt="Indoor-Spinningrad in einem Trainingsraum – KI-Beispielbild">`;return `<div class="strength-art"><svg viewBox="0 0 680 340" role="img" aria-label="${s.type==='rest'?'Ruhige Landschaft zur Regeneration':'Krafttraining mit einer Langhantel'}"><defs><radialGradient id="glow"><stop stop-color="#62417b"/><stop offset="1" stop-color="#221c2e"/></radialGradient></defs><rect width="680" height="340" fill="url(#glow)"/>${s.type==='rest'?'<circle cx="470" cy="87" r="40" fill="#d7c3ff" opacity=".7"/><path d="M0 280L150 120L320 290L450 170L680 300V340H0Z" fill="#4a3b5c"/><path d="M0 310L250 230L400 330L680 240V340H0Z" fill="#74618b"/>':'<g transform="translate(340 170) rotate(-18)" stroke="#c9b5ed" stroke-linecap="round"><path d="M-205 0H205" stroke-width="15"/><path d="M-155-70V70M155-70V70" stroke-width="38"/><path d="M-195-44V44M195-44V44" stroke-width="25"/><path d="M-90 50H95" stroke="#765c93" stroke-width="2"/></g>'}</svg></div>`}
function dayFocus(){let s=session(selectedDay),i=(new Date(selectedDay+'T12:00:00').getDay()+6)%7;return `<section class="card focus-card"><div class="focus-copy"><div class="eyebrow">${selectedDay===today()?'DEIN TAG HEUTE':dayNames[i].toUpperCase()} · ${date(selectedDay)}</div><h2>${s.type==='gym'?'GYM | '+s.name:s.name}</h2><button class="primary" onclick="sessionDetail('${selectedDay}')">Training öffnen</button>${s.type==='run'?'<div class="hint" style="margin-top:16px">Strecke symbolisch, keine Navigation. Distanz vor Ort selbst wählen.</div>':''}</div><div class="focus-visual">${activityArt(s)}</div></section>`}
function overview(){let e=last();return heading('DEIN Fitness-Schmalle','Was steht heute an?','Wähle deinen Tag. Dein Training ist einen Klick entfernt.',`<button class="primary" onclick="entryForm()">＋ Gewicht eintragen</button>`)+`<section class="week-section">${weekControl()}${dayPicker()}</section>${dayFocus()}<div class="grid quick-stats">${metric('Gewicht',fmt(e.weight,2),'kg',`Zuletzt: ${date(e.date)}`)}${metric('Körperfett',fmt(e.fat),'%', 'Waagenwert · als Trend betrachten')}<button class="card quick-link" onclick="go('nutrition')"><span class="label">Hunger auf neue Ideen?</span><strong>10 Hauptgerichte</strong><span class="purple">Rezepte entdecken →</span></button></div><details class="card more-details"><summary>Fortschritt & Tages-To-dos</summary><div class="grid two"><div>${chart()}<button onclick="go('forecast')">Prognose & Historie öffnen →</button></div><div>${dailyTasks(selectedDay)}<button onclick="dayDetail('${selectedDay}')">Tagesnotiz öffnen</button></div></div></details>`}
function training(){return heading('DEIN TRAINING','Ein Tag. Ein klarer Plan.','Kraft, Rad und Laufen – passend zu deiner Trainingswoche.')+`<section class="week-section">${weekControl()}${dayPicker()}</section>${dayFocus()}<details class="card more-details"><summary>Ganze Woche & Trainingsprinzip</summary>${trainingRows()}<p>A: Mo Push · Mi Pull + Legs · Fr Push.<br>B: Mo Pull + Legs · Mi Push · Fr Pull + Legs.</p><p>Di / Do: Indoor-Rad 45–60 Minuten. Am Wochenende ein lockerer Lauf. Distanz nur bei guter Erholung behutsam steigern.</p><button onclick="go('settings')">Lauftag & Distanz anpassen</button></details>`}
function nutrition(){let logs=foodLog(),sum=logs.reduce((s,x)=>s+x.kcal,0);return heading('DEIN REZEPT-REPERTOIRE','Was schmeckt dir heute?','10 Hauptgerichte. Einfache Zutaten. Neue Inspiration.',`<button onclick="openFoodDiary()">Tageslog · ${fmt(sum,0)} kcal →</button>`)+`<div class="recipe-toolbar"><button onclick="shopping()">Einkaufsliste</button><button onclick="prep()">Meal Prep So / Mi</button><span>KI-Beispielfotos · Nährwerte grob geschätzt</span></div><div class="grid recipe-grid">${meals.map((m,i)=>`<article class="card recipe-card"><button class="recipe-image-button" onclick="mealDetail(${i})" aria-label="Rezept ${m.name} öffnen"><img class="recipe-photo" src="${window.ATHLETIC_ASSETS[dishIds[i]]}" alt="${m.name} – KI-generiertes Beispielfoto" loading="lazy"></button><div class="recipe-body"><div class="eyebrow">${i===9?'35–45':i===0||i===8?'25':'20'} MIN · HAUPTMAHLZEIT</div><h2>${m.name}</h2><p>≈ ${m.kcal} kcal · ≈ ${m.p} g Protein</p><div class="actions"><button class="primary" onclick="mealDetail(${i})">Rezept öffnen →</button><button onclick="logMeal(${i})" aria-label="Eine Portion ${m.name} erfassen">＋ Erfassen</button></div></div></article>`).join('')}</div>`}
function openFoodDiary(){let logs=foodLog(),sum=logs.reduce((s,x)=>s+x.kcal,0);modal(`<h2>Dein Tageslog</h2><label>Tag<input type="date" value="${foodDate}" onchange="foodDate=this.value;closeAthleticDialog();render();openFoodDiary()"></label><div class="metric">${fmt(sum,0)} <small>/ ${state.kcal} kcal</small></div>${logs.length?logs.map((l,i)=>`<div class="training"><div><b>${esc(l.name)}</b><span class="meta">${fmt(l.kcal,0)} kcal · ${l.estimated?'geschätzt':'manuell'}</span></div><button class="subtle" onclick="removeFood(${i});closeAthleticDialog();openFoodDiary()">Entfernen</button></div>`).join(''):'<p>Noch keine Mahlzeiten erfasst.</p>'}<div class="actions"><button class="primary" onclick="closeAthleticDialog();customFood()">＋ Manuell eintragen</button><button onclick="closeAthleticDialog();go('settings')">Planwert ändern</button></div><details style="margin-top:20px"><summary>Kalorien & Grundumsatz</summary><p class="hint">${state.kcal} kcal sind ein editierbarer Testwert, kein errechneter Bedarf. Dein genannter Grundumsatz von 2.100–2.300 kcal ist nicht der Gesamtverbrauch. 2 Hauptmahlzeiten, weitere Snacks bei Bedarf; Frühstück bleibt freiwillig.</p></details>`)}
function shopping(){let list={};for(let i=0;i<7;i++)for(let m of [meals[i%10],meals[(i+3)%10]])for(let [n,q,u] of m.items){list[n]??={q:0,u};list[n].q+=q}modal(`<h2>Beispieleinkauf · 7 Tage</h2><p>14 Hauptmahlzeiten aus deinem Repertoire. Mengen bei Bedarf anpassen.</p>${Object.entries(list).map(([n,v])=>`<label class="check"><input type="checkbox" ${state.tasks['shop-'+n]?'checked':''} data-shop="${esc(n)}" onchange="state.tasks['shop-'+this.dataset.shop]=this.checked;save()">${esc(n)} · ${v.q} ${v.u}</label>`).join('')}<p class="hint">Beispielrotation, keine Liste aus deinen gegessenen Mahlzeiten. Packungsgrößen und Vorräte selbst berücksichtigen.</p>`)}
const previousSessionDetail=sessionDetail;
sessionDetail=function(d){previousSessionDetail(d);let s=session(d);if(s.type==='run'||s.type==='bike')$('#modalbody').insertAdjacentHTML('beforeend',`<div class="detail-art">${activityArt(s)}</div>`)};
const previousMealDetail=mealDetail;
mealDetail=function(i){previousMealDetail(i);let img=document.createElement('img');img.className='recipe-photo detail-photo';img.src=window.ATHLETIC_ASSETS[dishIds[i]];img.alt=meals[i].name+' · KI-Beispielfoto';$('#modalbody').insertBefore(img,$('#modalbody').querySelector('h2').nextSibling);};
render();
</script><script>// Version 3: upper/lower split, compact overview, steps and transparent goal scenarios.
function ensureGoals(){state.goalFat??=15;state.goalDate??='2027-06-30';state.stepGoal??=10000;state.steps??={};state.extraRides??={}}
ensureGoals();nav.find(n=>n[0]==='forecast')[2]='Ziele & Prognose';
const splitPlan={Oberkörper:['Brustpresse | Bankdrücken','Butterfly','Latzug','Rudermaschine','Schulterpresse','Seitheben','Arme'],Unterkörper:['Beinpresse','Beinbeuger','Beinstrecker','Waden','Rückenstrecker','Bauch','Arme']};
exercises.Oberkörper=splitPlan.Oberkörper.map(n=>n+' · 3 × '+(n==='Arme'?'Supersätze':'8–12'));
exercises.Unterkörper=splitPlan.Unterkörper.map(n=>n+' · 3 × '+(n==='Arme'?'Supersätze':'8–12'));
function session(d){let day=(new Date(d+'T12:00:00').getDay()+6)%7,t=weekType(d);if([0,2,4].includes(day))return {name:((t==='A'&&day!==2)||(t==='B'&&day===2))?'Oberkörper':'Unterkörper',sub:'Gym · dein Plan aus dem Foto',type:'gym'};if([1,3].includes(day))return {name:'Indoor-Rad',sub:'45–60 Min · locker',type:'bike'};if(day===Number(state.runDay))return {name:'Locker joggen',sub:`${fmt(state.runKm)} km · Sprechtempo`,type:'run'};return {name:'Regeneration',sub:'Ruhe & lockere Bewegung',type:'rest'}}
function exerciseOverview(s){return `<div class="exercise-overview"><div class="eyebrow">DEINE ÜBUNGEN</div><div class="exercise-mini-head"><span>Übung</span><span>Sätze · Wdh.</span></div>${splitPlan[s.name].map(n=>`<div class="exercise-mini-row"><span>${n}</span><b>${n==='Arme'?'3 × Supersätze':'3 × 8–12'}</b></div>`).join('')}<div class="hint">Aus deinem Trainingsfoto übernommen.</div></div>`}
function trainingTip(d){let s=session(d),ill=state.events.some(e=>e.type==='ill'&&d>=e.start&&d<=e.end);if(ill)return {title:'Heute zählt Erholung.',text:'Du hast eine Krankheitsphase eingetragen. Zusatzeinheiten auslassen und auch das Schrittziel flexibel behandeln.',benefit:'Erholung unterstützt einen behutsamen Wiedereinstieg.',extra:false};if(s.name==='Oberkörper')return {title:'Ein lockerer Bonus – wenn du dich frisch fühlst.',text:'Optional kannst du heute 30–45 Minuten locker aufs Indoor-Rad. Sprechtempo, kein Intervalltraining. Vor einem schweren Beintag lieber kürzer oder weglassen.',benefit:'Zusätzliche ruhige Ausdauerzeit kann deine Grundlagenausdauer unterstützen. Der tatsächliche Energieverbrauch ist individuell; ein schnellerer KFA-Verlust ist damit nicht zugesichert.',extra:true};if(s.name==='Unterkörper')return {title:'Gute Beine brauchen auch Erholung.',text:'Heute reicht dein Krafttraining. Wenn es angenehm ist: 10 Minuten locker gehen und die übrigen Schritte entspannt über den Tag verteilen.',benefit:'Ein leichter Ausklang bringt Bewegung in den Alltag, ohne noch eine harte Einheit hinzuzufügen.',extra:false};if(s.type==='bike')return {title:'Locker ist heute genau richtig.',text:'45–60 Minuten Rad sind bereits deine Ausdauereinheit. Du solltest noch in ganzen Sätzen sprechen können. Kein Zusatztraining nötig.',benefit:'Eine gut dosierte Einheit lässt sich eher regelmäßig durchführen und hält den nächsten Krafttag im Blick.',extra:false};if(s.type==='run')return {title:'Sammle gute Kilometer, keine Bestzeiten.',text:'Starte ruhig, Gehpausen sind erlaubt. Bleib bei deiner aktuellen Distanz, wenn die Beine müde sind; danach kurz locker ausgehen.',benefit:'Eine behutsame Belastung hilft dir, deine Laufroutine Schritt für Schritt aufzubauen.',extra:false};return {title:'Auch Pause bringt dich weiter.',text:'Wenn du möchtest, teile lockere Spaziergänge über den Tag auf. Das Schrittziel ist ein Wochenschnitt und keine Pflicht bei Krankheit oder Erschöpfung.',benefit:'Eine machbare Alltagsroutine unterstützt Konstanz; Erholung bleibt Teil deines Plans.',extra:false}}
function tipCard(d){let t=trainingTip(d);return `<div class="tip-box"><div><b>✦ ${t.title}</b><p>${t.text}</p></div><details><summary>Was bringt mir das?</summary><p>${t.benefit}</p><p class="hint">Optionale Bewegung verändert die Prognose nicht automatisch. Nicht als Ausgleich für Essen gedacht.</p>${t.extra?`<button onclick="extraRide('${d}')">${state.extraRides[d]?'Optionalen Ride ansehen':'Optionalen Ride vormerken'}</button>`:''}</details></div>`}
function extraRide(d){let v=state.extraRides[d]||{minutes:30,done:false};modal(`<h2>Optionaler lockerer Ride</h2><p>${date(d)} · nur bei guter Erholung. Dein regulärer Trainingsplan bleibt der Ausgangspunkt.</p><form id="extraRideForm"><label>Dauer · Minuten<input name="minutes" type="number" min="15" max="45" step="5" value="${v.minutes}" required></label><label class="check"><input name="done" type="checkbox" ${v.done?'checked':''}>Erledigt</label><button class="primary">Ride speichern</button></form>`);$('#extraRideForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);state.extraRides[d]={minutes:+f.get('minutes'),done:f.has('done')};save();closeAthleticDialog();render();toast('Optionaler Ride gespeichert')}}
function dayFocus(){let s=session(selectedDay),i=(new Date(selectedDay+'T12:00:00').getDay()+6)%7;return `<section class="card focus-card focus-v3 ${s.type==='gym'?'with-exercises':''}"><div class="focus-copy"><div class="eyebrow">${dayNames[i].toUpperCase()} · ${date(selectedDay)}</div><h2>${s.type==='gym'?'GYM | '+s.name:s.name}</h2><button class="primary" onclick="sessionDetail('${selectedDay}')">Training öffnen</button></div><div class="focus-visual">${activityArt(s)}</div>${s.type==='gym'?exerciseOverview(s):`<div class="activity-side"><div class="eyebrow">DEIN FOKUS</div><h3>${s.type==='bike'?'Ruhig in den Rhythmus.':s.type==='run'?'Schritt für Schritt am Wasser.':'Heute darf es leicht sein.'}</h3><p>${s.type==='bike'?'45–60 Minuten locker. Kein Intervallprogramm nötig.':s.type==='run'?`${fmt(state.runKm)} km mit Gehpausen nach Bedarf.`:'Erholung und ein lockerer Spaziergang, wenn es passt.'}</p><button onclick="stepForm()">Schritte eintragen</button></div>`}</section>`}
function stepStats(){ensureGoals();let days=Array.from({length:7},(_,i)=>add(week,i)),values=days.filter(d=>Object.hasOwn(state.steps,d)).map(d=>state.steps[d]);return {count:values.length,total:values.reduce((a,b)=>a+b,0),avg:values.length?values.reduce((a,b)=>a+b,0)/values.length:null}}
function stepForm(){let x=stepStats();modal(`<h2>Deine Schritte · ${date(week)}</h2><p>Ziel: im Wochenschnitt ${fmt(state.stepGoal,0)} pro Tag, also ${fmt(state.stepGoal*7,0)} pro Woche.</p><form id="stepsForm"><div class="steps-fields">${Array.from({length:7},(_,i)=>{let d=add(week,i);return `<label>${dayNames[i]} · ${date(d)}<input name="${d}" type="number" min="0" max="100000" step="1" ${d>today()?'disabled':''} value="${state.steps[d]??''}" placeholder="Noch nicht erfasst"></label>`}).join('')}</div><p class="hint">Leere Felder bleiben fehlende Daten. Der angezeigte Schnitt bezieht sich nur auf erfasste Tage; bei 7/7 ist er der vollständige Wochenschnitt. Keine Kaloriengutschrift aus Schritten.</p><button class="primary">Schritte speichern</button></form>`);$('#stepsForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);for(let i=0;i<7;i++){let d=add(week,i);if(d>today())continue;let v=f.get(d);if(v==='')delete state.steps[d];else if(v!==null)state.steps[d]=+v}save();closeAthleticDialog();render();toast('Schritte gespeichert')}}
function overview(){let e=last(),st=stepStats(),tip=trainingTip(selectedDay);return `<div class="overview-v3">${heading('Fitness-Schmalle','Dein Tag. Dein Plan.','',`<button class="primary" onclick="entryForm()">＋ Check-in</button>`)}<div class="top-summary"><div>${weekControl()}</div><div class="compact-metrics"><button onclick="entryForm('${e.date}')"><small>Gewicht</small><strong>${fmt(e.weight,2)} <em>kg</em></strong><span>Ziel ${fmt(state.target,0)} kg</span></button><button onclick="go('forecast')"><small>Körperfett · KFA</small><strong>${fmt(e.fat)} <em>%</em></strong><span>Ziel ${fmt(state.goalFat,0)} %</span></button><button onclick="stepForm()"><small>Schritte · Wochenziel</small><strong>${weeklyStepChecks()}/7 <em>erreicht</em></strong><span>Ziel ${fmt(state.stepGoal,0)} pro Tag</span></button><button onclick="go('nutrition')"><small>Inspiration</small><strong>10 Gerichte →</strong></button></div></div>${dayPicker()}${dayFocus()}${tipCard(selectedDay)}<div class="overview-bottom"><button onclick="go('forecast')">Dein Ziel: ${fmt(state.goalFat,0)} % KFA · ${monthLabel(state.goalDate)} & Prognose →</button><button onclick="dayDetail('${selectedDay}')">Tages-To-dos & Notiz →</button></div></div>`}
function training(){return heading('OBERKÖRPER × UNTERKÖRPER','Dein Training im Blick.','')+`<section class="week-section">${weekControl()}${dayPicker()}</section>${dayFocus()}${tipCard(selectedDay)}<details class="card more-details"><summary>Ganze Woche & Rotation</summary>${trainingRows()}<p>A: Mo Oberkörper · Mi Unterkörper · Fr Oberkörper.<br>B: Mo Unterkörper · Mi Oberkörper · Fr Unterkörper.</p><p>Di / Do: Indoor-Rad. Ein Wochenendlauf, der andere Tag Erholung.</p><button onclick="go('settings')">Lauftag & Distanz ändern</button></details>`}
// Goal scenarios extend beyond the former 88-kg stop; they are not clinical predictions.
function scenarioCurve(rate){let e=last(),arr=[{d:e.date,weight:e.weight}],w=e.weight,lean=e.weight*(1-e.fat/100),floor=Math.min(e.weight,Math.max(state.height**2*18.5,lean/.94));for(let i=1;i<=728;i++){let dt=add(e.date,i),factor=1;if(state.holiday&&dt.slice(5)>='12-20'&&dt.slice(5)<='12-31')factor=0;for(let ev of state.events)if(dt>=ev.start&&dt<=ev.end)factor=Math.min(factor,{ill:0,plateau:0,food:.5}[ev.type]);w=Math.max(floor,w-rate/7*factor*Math.max(.6,1-i/1600));arr.push({d:dt,weight:w})}return arr}
let curvesCache;function goalCurves(){let key=JSON.stringify([last(),state.rate,state.events,state.holiday,state.height]);if(curvesCache?.key===key)return curvesCache;return curvesCache={key,mid:scenarioCurve(state.rate),fast:scenarioCurve(Math.min(.75,state.rate*1.35)),slow:scenarioCurve(state.rate*.65)}}
let journeyMetric='weight',journeyWeeks=52;
function journeyChart(){let e=last(),c=goalCurves(),fat=journeyMetric==='fat',goal=fat?state.goalFat:state.target,convert=(w,f=e.fat)=>fat?Math.max(3,100*(1-e.weight*(1-f/100)/w)):w,rows=Array.from({length:journeyWeeks+1},(_,i)=>({d:c.mid[i*7].d,v:convert(c.mid[i*7].weight),low:convert(c.fast[i*7].weight,Math.max(3,e.fat-3)),high:convert(c.slow[i*7].weight,Math.min(65,e.fat+3))})),lo=Math.floor(Math.min(goal,...rows.map(p=>p.low))-1),hi=Math.ceil(Math.max(goal,...rows.map(p=>p.high))+1),x=i=>45+i/journeyWeeks*620,y=v=>210-(v-lo)/(hi-lo)*175;let band=[...rows.map((p,i)=>`${x(i)},${y(p.low)}`),...rows.map((p,i)=>`${x(i)},${y(p.high)}`).reverse()].join(' ');return `<div class="tabs"><button aria-pressed="${!fat}" onclick="journeyMetric='weight';render()">Gewicht · kg</button><button aria-pressed="${fat}" onclick="journeyMetric='fat';render()">Körperfett · %</button><label>Horizont<select onchange="journeyWeeks=+this.value;render()">${[26,52,104].map(n=>`<option value="${n}" ${n===journeyWeeks?'selected':''}>${n} Wochen</option>`).join('')}</select></label></div><svg class="chart" viewBox="0 0 700 255" role="img" aria-label="${fat?'KFA':'Gewichts'}-Szenario über ${journeyWeeks} Wochen mit Zielmarkierung">${Array.from({length:5},(_,i)=>{let v=lo+(hi-lo)*i/4;return `<line x1="45" x2="665" y1="${y(v)}" y2="${y(v)}" stroke="#393041"/><text x="0" y="${y(v)+4}" class="chart-label">${fmt(v,0)}</text>`}).join('')}<polygon points="${band}" fill="#b699ff" opacity=".15"/><line x1="45" x2="665" y1="${y(goal)}" y2="${y(goal)}" stroke="#a6e3bc" stroke-dasharray="5 5"/><text x="660" y="${y(goal)-7}" text-anchor="end" fill="#a6e3bc" font-size="13">Ziel ${fmt(goal)} ${fat?'%':'kg'}</text><polyline points="${rows.map((p,i)=>`${x(i)},${y(p.v)}`).join(' ')}" fill="none" stroke="#c3a3ff" stroke-width="3"/><circle cx="45" cy="${y(rows[0].v)}" r="5" fill="#a6e3bc"/>${[0,.25,.5,.75,1].map(f=>{let i=Math.round(journeyWeeks*f);return `<text x="${x(i)}" y="242" text-anchor="middle" class="chart-label">${new Date(rows[i].d+'T12:00:00').toLocaleDateString('de-DE',{month:'2-digit',year:'2-digit'})}</text>`}).join('')}</svg><p class="hint">Punkt: letzter Messwert. Linie: mittleres Szenario. Fläche: schneller/langsamer Verlauf${fat?' einschließlich ±3 Prozentpunkten am Ausgangswert':''}. Keine statistischen Konfidenzintervalle. Lange Ausblicke sind besonders unsicher.</p>`}
function arrival(value,type){let e=last(),c=goalCurves(),lean=e.weight*(1-e.fat/100),threshold=type==='fat'?lean/(1-value/100):value,earlyThreshold=type==='fat'?e.weight*(1-Math.max(3,e.fat-3)/100)/(1-value/100):value,lateThreshold=type==='fat'?e.weight*(1-Math.min(65,e.fat+3)/100)/(1-value/100):value;let reached=type==='fat'?e.fat<=value:e.weight<=value;return {reached,mid:c.mid.find(p=>p.weight<=threshold)?.d,early:c.fast.find(p=>p.weight<=earlyThreshold)?.d,late:c.slow.find(p=>p.weight<=lateThreshold)?.d,weight:threshold}}
function monthLabel(d){return d?new Date(d+'T12:00:00').toLocaleDateString('de-DE',{month:'short',year:'numeric'}):'außerhalb von 104 Wochen'}
function targetTile(value,type){let a=arrival(value,type),unit=type==='fat'?'% KFA':'kg',current=type==='fat'?last().fat:last().weight,base=type==='fat'?28.1:94.6,progress=Math.min(100,Math.max(0,(base-current)/(base-value)*100));return `<article class="card target-tile"><div class="row"><h3>${fmt(value,value%1?1:0)} ${unit}</h3><span class="tag">${a.reached?'Laut Messwert erreicht':'Szenario'}</span></div><div class="progress"><div style="width:${Number.isFinite(progress)?progress:0}%"></div></div><div class="target-month">${a.reached?date(last().date):monthLabel(a.mid)}</div><p class="hint">${a.reached?'Einzelmessung, Trend weiter beobachten.':`Zeitkorridor: ${monthLabel(a.early)} – ${monthLabel(a.late)}`}</p>${type==='fat'?`<div class="hint">Rechnerisch ≈ ${fmt(a.weight)} kg bei unveränderter fettfreier Masse.</div>`:''}<button class="subtle" onclick="goalDetails(${value},'${type}')">Annahmen & Verlauf →</button></article>`}
function goalDetails(value,type){let a=arrival(value,type);modal(`<h2>${fmt(value)} ${type==='fat'?'% KFA':'kg'} als Meilenstein</h2><p>Mittleres Szenario: ${a.reached?'laut letztem Messwert erreicht':monthLabel(a.mid)}.</p><p>Illustrativer Zeitkorridor: ${monthLabel(a.early)} bis ${monthLabel(a.late)}. Kein garantierter Termin und kein statistisches Konfidenzintervall.</p><p class="hint">Die Zeitrechnung startet am letzten Messpunkt (${date(last().date)}) mit ${fmt(state.rate,2)} kg/Woche. Schneller: ×1,35 (max. 0,75), langsamer: ×0,65. Abflachung bis auf 60 % der Anfangsrate, Weihnachts-/Krankheits-/Plateau-Szenarien berücksichtigt. Rechenhorizont 104 Wochen. Bei 0 kg/Woche kann ein niedrigeres Ziel nicht terminiert werden.</p>${type==='fat'?'<p class="hint">KFA wird bei konstant gehaltener fettfreier Masse abgeleitet; das kann bei Muskel-, Wasser- und Messänderungen deutlich falsch liegen. Der KFA-Zeitkorridor variiert zusätzlich den Ausgangswert um ±3 Prozentpunkte als Modellannahme, nicht als zugesicherte Waagengenauigkeit.</p>':''}<button class="primary" onclick="closeAthleticDialog();goalForm()">Eigene Ziele ändern</button>`)}
function goalForm(){modal(`<h2>Deine Ziele anpassen</h2><form id="goalsForm"><div class="fields"><label>Zielgewicht · kg<input name="target" type="number" min="70" max="94" step=".1" value="${state.target}" required></label><label>Ziel-KFA · %<input name="fat" type="number" min="8" max="40" step=".1" value="${state.goalFat}" required></label><label>Wunschdatum<input name="date" type="date" value="${state.goalDate}" required></label><label>Schritte pro Tag im Wochenschnitt<input name="steps" type="number" min="1000" max="30000" step="500" value="${state.stepGoal}" required></label></div><p class="hint">Wunschdatum steuert die Abnahmerate nicht automatisch. 12 % ist dein persönliches Wunschziel; ohne Alter, Geschlecht und gesundheitlichen Kontext ist das keine bestätigte Empfehlung. KFA und Gewicht lassen sich nicht unabhängig voneinander vorhersagen.</p><button class="primary">Ziele speichern</button></form>`);$('#goalsForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);state.target=+f.get('target');state.goalFat=+f.get('fat');state.goalDate=f.get('date');state.stepGoal=+f.get('steps');save();closeAthleticDialog();render();toast('Ziele gespeichert')}}
function forecastAt(d){let c=goalCurves(),e=last(),days=Math.max(0,Math.round((new Date(d+'T12:00:00')-new Date(e.date+'T12:00:00'))/86400000)),idx=Math.min(728,days),w=c.mid[idx].weight,spread=.6+.2*Math.sqrt(days/7)+.05*days/7;return {d,weight:w,low:Math.max(state.height**2*18.5,w-spread),high:w+spread,fat:Math.max(3,100*(1-e.weight*(1-e.fat/100)/w)),fatBand:3+days/7*.06}}
function forecast(){let e=last(),deadline=forecastAt(state.goalDate),past=state.goalDate<today(),targetA=arrival(state.goalFat,'fat'),st=stepStats(),fats=[...new Set([20,16,12,state.goalFat])].sort((a,b)=>b-a),weights=[...new Set([90,85,80,state.target])].sort((a,b)=>b-a),months=[];for(let i=1;i<=8;i++){let dt=new Date(e.date+'T12:00:00');dt.setMonth(dt.getMonth()+i,1);months.push(forecastAt(iso(dt)))}return heading('DEIN WEG ZUM ZIEL','Etappen statt falscher Sicherheit.','Wunschziel und Szenario bleiben sichtbar getrennt.',`<button class="primary" onclick="goalForm()">Ziele ändern</button>`)+`<div class="grid two goal-top"><section class="card hero"><div class="eyebrow">DEIN WUNSCHZIEL · ${date(state.goalDate)}</div><h2>${fmt(state.goalFat,0)} % KFA <span class="purple">/ ${fmt(state.target)} kg</span></h2><p>Letzter Check-in: ${fmt(e.weight)} kg · ${fmt(e.fat)} % KFA.</p><div class="notice">${past?'Das Wunschdatum liegt in der Vergangenheit. Bitte ändern.':`Am Wunschdatum im mittleren Szenario: ≈ ${fmt(deadline.weight)} kg / ≈ ${fmt(deadline.fat)} % KFA.`}<br>${!past&&targetA.mid&&targetA.mid>state.goalDate?'Dein KFA-Wunschziel liegt im mittleren Szenario später. Das ist kein Grund, das Defizit automatisch zu verschärfen.':''}</div><p class="hint">Die beiden Wunschziele müssen rechnerisch nicht zusammenpassen: ${fmt(state.goalFat)} % KFA entsprächen bei unveränderter fettfreier Masse etwa ${fmt(targetA.weight)} kg. Deine tatsächliche Körperzusammensetzung kann sich anders entwickeln.</p></section><section class="card"><div class="eyebrow">ALLTAG ZÄHLT</div><h2>${fmt(state.stepGoal,0)} Schritte im Schnitt</h2><div class="metric">${st.avg===null?'—':fmt(st.avg,0)} <small>Ø erfasste Tage</small></div><p class="hint">${st.count}/7 Tage erfasst · ${fmt(st.total,0)} / ${fmt(state.stepGoal*7,0)} Wochenschritte. Offene Tage sind keine gemessenen Nullen.</p><div class="progress"><div style="width:${Math.min(100,st.total/(state.stepGoal*7)*100)}%"></div></div><button onclick="stepForm()">Schritte dieser Woche eintragen</button></section></div><h2 class="section-heading">Gewichts-Meilensteine</h2><div class="grid milestones">${weights.map(v=>targetTile(v,'weight')).join('')}</div><h2 class="section-heading">Körperfett-Meilensteine</h2><div class="grid milestones">${fats.map(v=>targetTile(v,'fat')).join('')}</div><div class="grid two"><section class="card"><h2>Dein Weg zum Ziel</h2>${journeyChart()}<p class="hint">Bandbreiten und Termine sind illustrative Szenarien. Keine Wahrscheinlichkeiten, kein Versprechen.</p></section><section class="card"><h2>Annahmen ändern</h2><label>Anfängliche Verlustrate · ${fmt(state.rate,2)} kg/Woche<input type="range" min="0" max=".75" step=".05" value="${state.rate}" onchange="state.rate=+this.value;save();render()"></label><label class="check"><input type="checkbox" ${state.holiday?'checked':''} onchange="state.holiday=this.checked;save();render()">20.–31. Dezember: Gewicht halten</label><button onclick="eventForm()">Krankheit / Plateau / Essensausnahmen</button>${state.events.map((ev,i)=>`<div class="event">${{ill:'Krankheit',plateau:'Plateau',food:'Essensausnahme'}[ev.type]} · ${date(ev.start)}–${date(ev.end)}<button class="subtle" onclick="state.events.splice(${i},1);save();render()">Entfernen</button></div>`).join('')}<details><summary>Modell & Quellen</summary><p class="hint">Keine Kalorienformel aus dem Grundumsatz; keine automatische Kaloriengutschrift aus Schritten oder Zusatzrad. Bei neuen Messungen startet die Rechnung neu. Terminannahmen sind in jedem Meilenstein erklärt. 12 % KFA sind kein universell geeignetes Gesundheitsziel. Körperfettwaagen und Änderungen fettfreier Masse begrenzen diese Darstellung.</p><p class="hint"><a href="https://www.cdc.gov/healthy-weight-growth/losing-weight/" target="_blank" rel="noopener">CDC · nachhaltige Gewichtsabnahme</a><br><a href="https://www.niddk.nih.gov/health-information/weight-management/body-weight-planner" target="_blank" rel="noopener">NIDDK · Body Weight Planner</a> · dieses Dashboard implementiert dessen Modell nicht.</p></details></section></div><details class="card more-details"><summary>Jeder Monatsanfang</summary>${forecastTable(months)}</details><details class="card more-details"><summary>Wöchentlicher Ausblick</summary>${forecastTable(forecasts().slice(1))}</details><details class="card more-details"><summary>Messhistorie bearbeiten</summary>${history()}</details>`}
const renderBeforeGoals=render;
render=function(){ensureGoals();renderBeforeGoals();if(page==='settings')$('#app').insertAdjacentHTML('afterbegin',`<div class="card" style="margin-top:20px"><h2>Deine Ziele & Schritte</h2><p>${fmt(state.goalFat)} % KFA · ${fmt(state.target)} kg · ${date(state.goalDate)}<br>${fmt(state.stepGoal,0)} Schritte im täglichen Wochenschnitt</p><button class="primary" onclick="goalForm()">Ziele ändern</button></div>`)};
const importBeforeGoals=validateImport;
validateImport=function(s){importBeforeGoals(s);for(let [k,min,max] of [['goalFat',8,40],['stepGoal',1000,30000]])if(s[k]!==undefined&&(!Number.isFinite(s[k])||s[k]<min||s[k]>max))throw Error();if(s.goalDate!==undefined&&!validDate(s.goalDate))throw Error();if(s.steps!==undefined){if(!s.steps||typeof s.steps!=='object'||Array.isArray(s.steps))throw Error();for(let [d,n] of Object.entries(s.steps))if(!validDate(d)||!Number.isInteger(n)||n<0||n>100000)throw Error()}if(s.extraRides!==undefined){if(!s.extraRides||typeof s.extraRides!=='object'||Array.isArray(s.extraRides))throw Error();for(let [d,v] of Object.entries(s.extraRides))if(!validDate(d)||!v||!Number.isFinite(v.minutes)||v.minutes<15||v.minutes>45||typeof v.done!=='boolean')throw Error()}return s};
render();

</script><script>// Version 4 · two clear body-composition goals and a 2,000-kcal meal plan.
function ensureNutrition4(){ensureGoals();if(state.nutritionVersion!==4){state.target??=80;state.goalFat??=15;state.goalStartWeight??=95;state.deficitGoal??=500;state.nutritionVersion=4}state.kcal=2000;state.foodPlan??={breakfast:'bread',breadTopping:'egg',timing:'noon',main:0,coffee:3,milkMl:40,milkKcal:47};state.breakfastValues??={bread:250,skyr:63,tomato:18,cucumber:12,egg:78,chicken:105,oats:370,milk:47,banana:89,apple:65,cinnamon:247}}
ensureNutrition4();
const breakfastData={bread:{name:'Pure Kraft Brot · Skyr & Belag',ingredients:[['Pure Kraft Brot von Lidl',120,'g','bread'],['Skyr',150,'g','skyr'],['Tomate',150,'g','tomato'],['Gurke',100,'g','cucumber']]},oats:{name:'Haferflocken · Skyr · Banane',ingredients:[['Haferflocken',80,'g','oats'],['Skyr',300,'g','skyr'],['Milch',150,'ml','milk'],['Banane (ohne Schale)',120,'g','banana'],['Apfelmus',100,'g','apple'],['Zimt',2,'g','cinnamon']]}};
function breakfastRecipe(id){let b=breakfastData[id],items=b.ingredients.map(x=>[...x]);if(id==='bread'){if(state.foodPlan.breadTopping==='egg')items.push(['Spiegelei',1,'Stück','egg'],['Öl zum Braten',5,'g','oil']);else items.push(['Hähnchenaufschnitt',60,'g','chicken'])}let kcal=items.reduce((s,[n,q,u,k])=>s+(k==='egg'?q*state.breakfastValues.egg:k==='oil'?q*9:q*state.breakfastValues[k]/100),0);return {name:b.name,kcal,items}}
function dayPlan(){let p=state.foodPlan,b=p.breakfast==='none'?null:breakfastRecipe(p.breakfast),coffee=Math.round(p.coffee*p.milkMl*p.milkKcal/100),breakfast=b?Math.round(b.kcal):0,main=2000-coffee-breakfast,recipe=meals[p.main];return {b,coffee,breakfast,main,recipe,factor:main/recipe.kcal,split:p.timing==='split'||!b,total:2000}}
function planChanged(key,value){state.foodPlan[key]=['coffee','milkMl','milkKcal','main'].includes(key)?+value:value;save();render()}
function breakfastDetail(id){let b=breakfastRecipe(id);modal(`<h2>${b.name}</h2>${id==='bread'?'<p>Brot mit Skyr bestreichen, Tomate und Gurke dazu. Wahlweise Spiegelei oder Hähnchenaufschnitt.</p>':'<p>Haferflocken mit Milch und Skyr verrühren. Banane, Apfelmus und Zimt dazugeben; frisch essen oder gekühlt durchziehen lassen.</p>'}${b.items.map(([n,q,u])=>`<div class="training"><span>${n}</span><b>${q} ${u}</b></div>`).join('')}<div class="metric">≈ ${fmt(b.kcal,0)} <small>kcal</small></div><p class="hint">Portionsvorschlag. Brotwert ist ein editierbarer Platzhalter, kein verifiziertes Lidl-Etikett. Für genaue Planung Packungswerte und gegessene Mengen verwenden.</p><div class="actions"><button class="primary" onclick="state.foodPlan.breakfast='${id}';save();closeAthleticDialog();render()">Für Tagesplan wählen</button><button onclick="logBreakfast('${id}')">Gegessene Portion erfassen</button><button onclick="closeAthleticDialog();breakfastLabels()">Etikettwerte anpassen</button></div>`)}
function logBreakfast(id){let b=breakfastRecipe(id),k='food-'+foodDate;state.logs[k]??=[];state.logs[k].push({name:b.name,kcal:Math.round(b.kcal),p:0,estimated:true});save();closeAthleticDialog();render();toast('Frühstück erfasst')}
function breakfastLabels(){let names={bread:'Pure Kraft Brot · kcal/100 g',skyr:'Skyr · kcal/100 g',tomato:'Tomate · kcal/100 g',cucumber:'Gurke · kcal/100 g',egg:'Ei ohne Bratfett · kcal/Stück',chicken:'Hähnchenaufschnitt · kcal/100 g',oats:'Haferflocken · kcal/100 g',milk:'Milch im Frühstück · kcal/100 ml',banana:'Banane · kcal/100 g',apple:'Apfelmus · kcal/100 g',cinnamon:'Zimt · kcal/100 g'};modal(`<h2>Deine Frühstücksprodukte</h2><p>Aktuelle Packungswerte haben Vorrang. Das Brot ist nicht als konkretes Produkt verifiziert.</p><form id="breakfastLabelsForm"><div class="fields">${Object.entries(names).map(([k,n])=>`<label>${n}<input name="${k}" type="number" min="0" max="900" step=".1" value="${state.breakfastValues[k]}" required></label>`).join('')}</div><button class="primary" style="margin-top:20px">Werte speichern</button></form>`);$('#breakfastLabelsForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);for(let k of Object.keys(names))state.breakfastValues[k]=+f.get(k);save();closeAthleticDialog();render();toast('Produktwerte gespeichert')}}
function energyInfo(){modal(`<h2>2.000 kcal & Defizit</h2><p>Dein festes Tagesziel: <b>2.000 kcal</b>. Dein gewünschtes Defizit: ungefähr <b>500 kcal pro Tag</b>.</p><div class="notice">Dafür müsste dein durchschnittlicher Gesamtverbrauch ungefähr 2.500 kcal betragen. Dein genannter Grundumsatz von 2.100–2.300 kcal ist nicht der Gesamtverbrauch.</div><p>${state.tdee?`Dein hinterlegter Gesamtverbrauch von ${fmt(state.tdee,0)} kcal ergäbe rechnerisch ${fmt(state.tdee-2000,0)} kcal Defizit bei 2.000 kcal Zufuhr. Dieser Verbrauch ist eine Schätzung.`:'Ein Gesamtverbrauch ist noch nicht hinterlegt; das tatsächliche Defizit ist daher unbekannt.'}</p><p class="hint">Die Tagesplanung summiert sich anhand der ausgewählten Werte auf 2.000 kcal. Lebensmittel, Portionsmessung und Etiketten sind nicht auf die einzelne kcal exakt. Kaffee-Milch und Bratöl zählen mit. Die Gewichtsprognose bleibt ein eigenes Szenario und wird nicht automatisch aus den 500 kcal abgeleitet.</p><a href="https://www.nhs.uk/better-health/lose-weight/calorie-counting/" target="_blank" rel="noopener">NHS · Kalorien und Energiedefizit →</a><div class="actions"><button onclick="closeAthleticDialog();go('settings')">Gesamtverbrauch hinterlegen</button></div>`)}
function plannedDayView(){let p=state.foodPlan,d=dayPlan(),invalid=d.main<=0;return `<section class="card meal-planner"><div class="row"><div><div class="eyebrow">DEIN TAGESZIEL</div><h2>2.000 kcal. Dein Rhythmus.</h2></div><button onclick="openFoodDiary()">Tageslog öffnen →</button></div><div class="fields planner-controls"><label>Frühstück<select onchange="planChanged('breakfast',this.value)"><option value="bread" ${p.breakfast==='bread'?'selected':''}>Pure Kraft Brot mit Skyr</option><option value="oats" ${p.breakfast==='oats'?'selected':''}>Haferflocken, Skyr & Obst</option><option value="none" ${p.breakfast==='none'?'selected':''}>Heute ohne Frühstück</option></select></label><label>Dein Tagesrhythmus<select onchange="planChanged('timing',this.value)"><option value="noon" ${p.timing==='noon'?'selected':''}>Frühstück mittags · Hauptmahlzeit ca. 18 Uhr</option><option value="split" ${p.timing==='split'?'selected':''}>Frühstück morgens · Hauptgericht in 2 Portionen</option></select></label>${p.breakfast==='bread'?`<label>Belag<select onchange="planChanged('breadTopping',this.value)"><option value="egg" ${p.breadTopping==='egg'?'selected':''}>Spiegelei + 5 g Bratöl</option><option value="chicken" ${p.breadTopping==='chicken'?'selected':''}>Hähnchenaufschnitt</option></select></label>`:''}<label>Hauptgericht<select onchange="planChanged('main',this.value)">${meals.map((m,i)=>`<option value="${i}" ${p.main===i?'selected':''}>${m.name}</option>`).join('')}</select></label></div><details class="coffee-settings"><summary>Kaffee mit Milch · ${p.coffee} Tassen vormittags · ≈ ${fmt(d.coffee,0)} kcal</summary><div class="fields"><label>Tassen<select onchange="planChanged('coffee',this.value)">${[2,3].map(n=>`<option value="${n}" ${p.coffee===n?'selected':''}>${n} Tassen</option>`).join('')}</select></label><label>Milch pro Tasse · ml<input type="number" min="0" max="300" step="5" value="${p.milkMl}" onchange="if(this.reportValidity())planChanged('milkMl',this.value)"></label><label>Deine Milch · kcal/100 ml<input type="number" min="0" max="150" step=".1" value="${p.milkKcal}" onchange="if(this.reportValidity())planChanged('milkKcal',this.value)"></label></div><p class="hint">Kaffee ohne Zucker angenommen. Milchmenge zunächst als Beispiel; bitte an deinen Kaffee anpassen.</p></details><div class="day-budget"><div><span>Kaffee & Milch</span><strong>${fmt(d.coffee,0)} kcal</strong></div><div><span>${d.b?'Frühstück '+(p.timing==='noon'?'mittags':'morgens'):'Kein Frühstück'}</span><strong>${fmt(d.breakfast,0)} kcal</strong></div><div><span>${d.split?'Hauptgericht · 2 Portionen':'Hauptmahlzeit · ca. 18 Uhr'}</span><strong>${fmt(d.main,0)} kcal</strong>${d.split?`<small>≈ ${fmt(d.main/2,0)} kcal je Portion</small>`:''}</div><div class="budget-total"><span>Plan-Summe</span><strong>2.000 kcal</strong></div></div>${invalid?'<div class="notice">Frühstück und Milch belegen das Tagesbudget bereits. Bitte Mengen oder Produktwerte korrigieren.</div>':`<p class="hint">${d.recipe.name}: ≈ ${fmt(d.factor,2)} Rezeptportionen insgesamt${d.split?', auf zwei Mahlzeiten verteilen':''}. Große Portion darf nach Hunger und Alltag geteilt werden.</p><div class="actions"><button class="primary" onclick="planIngredients()">Mengen für diesen Tag →</button><button onclick="logPlannedDay()">Als gegessenen Tag erfassen</button><button onclick="breakfastLabels()">Frühstücks-Etikettwerte</button></div>`}<p class="hint">2.000 kcal sind dein Planwert. Werte und angezeigte Grammmengen bleiben Näherungen; Etiketten, tatsächliche Mengen und Öl mit erfassen. <button class="subtle" onclick="energyInfo()">500-kcal-Defizit verstehen →</button></p></section>`}
function planIngredients(){let d=dayPlan();modal(`<h2>Dein Tagesplan · 2.000 kcal</h2><p>${d.b?d.b.name+' plus ':''}${d.recipe.name}. ${d.split?'Das Hauptgericht in zwei Portionen teilen.':'Hauptgericht etwa um 18 Uhr.'}</p>${d.b?`<h3>Frühstück</h3>${d.b.items.map(([n,q,u])=>`<div class="training"><span>${n}</span><b>${q} ${u}</b></div>`).join('')}`:''}<h3 style="margin-top:20px">Hauptgericht · Gesamtmenge${d.split?' für 2 Portionen':''}</h3>${d.recipe.items.map(([n,q,u])=>`<div class="training"><span>${n}</span><b>${fmt(q*d.factor,u==='Stück'?1:0)} ${u}</b></div>`).join('')}<p>${d.recipe.recipe}</p><p class="hint">Die Hauptgerichte sind grob geschätzt, die Mengen proportional aus der Rezeptschätzung abgeleitet. Bei Packungswerten, anderer Sauce oder zusätzlichem Öl verändert sich die tatsächliche Energie. Frühstück und Kaffee werden vom Budget zuerst abgezogen.</p><button class="primary" onclick="closeAthleticDialog();mealDetail(${state.foodPlan.main})">Grundrezept öffnen</button>`)}
function shopping(){let d=dayPlan(),p=state.foodPlan,list={};function put(n,q,u){let k=n+'|'+u;list[k]??={n,q:0,u};list[k].q+=q}for(let [n,q,u] of d.recipe.items)put(n,q*d.factor*7,u);if(d.b)for(let [n,q,u] of d.b.items)put(n,q*7,u);put('Milch für Kaffee',p.coffee*p.milkMl*7,'ml');put('Kaffee',p.coffee*7,'Tassen');modal(`<h2>Einkauf · dein aktueller Tagesplan × 7</h2><p>Beispiel für sieben gleiche Tage, inklusive Frühstück und Kaffeemilch. Für mehr Abwechslung Gerichte und Mengen selbst kombinieren.</p>${Object.entries(list).map(([k,v])=>`<label class="check"><input type="checkbox" data-shop="${esc(k)}" ${state.tasks['shop4-'+k]?'checked':''} onchange="state.tasks['shop4-'+this.dataset.shop]=this.checked;save()">${esc(v.n)} · ${fmt(v.q,v.u==='Stück'?1:0)} ${v.u}</label>`).join('')}<p class="hint">Keine Bestands- oder Packungsgrößenprüfung. Hauptgericht-Mengen sind aus Rezeptschätzungen skaliert.</p>`)}
function logPlannedDay(){let d=dayPlan();if(d.main<=0)return toast('Bitte den Tagesplan korrigieren');let key='food-'+foodDate;state.logs[key]??=[];let existing=state.logs[key].filter(l=>!l.fromPlan);modal(`<h2>Tagesplan erfassen?</h2><p>Für ${date(foodDate)}: Kaffee, ${d.b?'Frühstück und ':''}${d.split?'zwei Hauptgericht-Portionen':'Hauptgericht'} als gegessen erfassen. Der Plan ist kein automatischer Nachweis deiner tatsächlichen Zufuhr.</p><p class="hint">${existing.length?`${existing.length} manuelle/rezeptbasierte Einträge bleiben zusätzlich erhalten; bei Überschneidung vorher im Tageslog korrigieren.`:'Bereits aus diesem Tagesplan erfasste Einträge werden ersetzt, damit keine doppelten Plan-Einträge entstehen.'}</p><button id="confirmPlan" class="primary">Genauso gegessen – erfassen</button>`);$('#confirmPlan').onclick=()=>{let coffee=Math.round(d.coffee),b=Math.round(d.breakfast),rest=2000-coffee-b,arr=[{name:'Kaffee mit Milch · '+state.foodPlan.coffee+' Tassen',kcal:coffee,p:0,estimated:true,fromPlan:true}];if(d.b)arr.push({name:d.b.name,kcal:b,p:0,estimated:true,fromPlan:true});if(d.split){let first=Math.floor(rest/2);arr.push({name:d.recipe.name+' · Portion 1/2',kcal:first,p:0,estimated:true,fromPlan:true},{name:d.recipe.name+' · Portion 2/2',kcal:rest-first,p:0,estimated:true,fromPlan:true})}else arr.push({name:d.recipe.name+' · große Hauptmahlzeit',kcal:rest,p:0,estimated:true,fromPlan:true});state.logs[key]=[...existing,...arr];save();closeAthleticDialog();render();toast('Gegessenen Tagesplan erfasst')}}
function nutrition(){let sum=foodLog().reduce((s,x)=>s+x.kcal,0);return heading('DEIN ESSEN. DEIN RHYTHMUS.','Frühstück & Hauptmahlzeiten.','Deine zwei Frühstücke und zehn Ideen fürs Hauptgericht.',`<button onclick="openFoodDiary()">${fmt(sum,0)} / 2.000 kcal →</button>`)+plannedDayView()+`<div class="row section-heading"><h2>Deine Frühstücke</h2><button onclick="breakfastLabels()">Produktwerte anpassen</button></div><div class="grid breakfast-grid">${['bread','oats'].map(id=>{let b=breakfastRecipe(id);return `<article class="card breakfast-card"><div class="eyebrow">FRÜHSTÜCK · AUCH MITTAGS</div><h2>${b.name}</h2><p>${id==='bread'?'Mit Tomate, Gurke und wahlweise Spiegelei oder Hähnchenaufschnitt.':'Mit Milch, Banane, Apfelmus und Zimt.'}</p><p>≈ ${fmt(b.kcal,0)} kcal nach deinen Produktwerten</p><button class="primary" onclick="breakfastDetail('${id}')">Zutaten & Portion →</button></article>`}).join('')}</div><div class="row section-heading"><h2>Deine Hauptmahlzeiten</h2><button onclick="shopping()">Einkaufsliste →</button><button onclick="prep()">Meal Prep →</button></div><p class="hint">Die Fotos zeigen Beispiele; im Tagesplan wird die Rezeptmenge an das verbleibende Budget angepasst.</p><div class="grid recipe-grid">${meals.map((m,i)=>`<article class="card recipe-card"><button class="recipe-image-button" onclick="mealDetail(${i})" aria-label="Rezept ${m.name} öffnen"><img class="recipe-photo" src="${window.ATHLETIC_ASSETS?.[dishIds[i]]||'assets/'+dishIds[i]+'.png'}" alt="${m.name} · KI-Beispielfoto" loading="lazy"></button><div class="recipe-body"><div class="eyebrow">HAUPTMAHLZEIT · BASISREZEPT</div><h2>${m.name}</h2><p>≈ ${m.kcal} kcal pro Grundportion</p><div class="actions"><button class="primary" onclick="planChanged('main',${i});window.scrollTo(0,0)">Für Tagesplan wählen</button><button onclick="mealDetail(${i})">Rezept →</button></div></div></article>`).join('')}</div>`}
function openFoodDiary(){let logs=foodLog(),sum=logs.reduce((s,x)=>s+x.kcal,0),delta=2000-sum;modal(`<h2>Dein Tageslog</h2><label>Tag<input type="date" value="${foodDate}" onchange="foodDate=this.value;closeAthleticDialog();render();openFoodDiary()"></label><div class="metric">${fmt(sum,0)} <small>/ 2.000 kcal</small></div><p>${delta>=0?`${fmt(delta,0)} kcal bis zum Planwert`:`${fmt(-delta,0)} kcal über dem Planwert`} · erfasste Werte, keine exakte Messung.</p>${logs.map((l,i)=>`<div class="training"><div><b>${esc(l.name)}</b><span class="meta">${fmt(l.kcal,0)} kcal · ${l.estimated?'geschätzt':'manuell'}</span></div><button class="subtle" onclick="removeFood(${i});closeAthleticDialog();openFoodDiary()">Entfernen</button></div>`).join('')||'<p>Noch nichts erfasst.</p>'}<div class="actions"><button class="primary" onclick="closeAthleticDialog();customFood()">＋ Manuell erfassen</button><button onclick="closeAthleticDialog();energyInfo()">Zufuhr & Defizit</button></div>`)}
function focusGoalChart(type){let c=goalCurves(),e=last(),fat=type==='fat',target=fat?state.goalFat:state.target,convert=w=>fat?Math.max(3,100*(1-e.weight*(1-e.fat/100)/w)):w,rows=Array.from({length:53},(_,i)=>({v:convert(c.mid[i*7].weight),lo:convert(c.fast[i*7].weight),hi:convert(c.slow[i*7].weight)})),lo=Math.floor(Math.min(target,...rows.map(r=>r.lo))-1),hi=Math.ceil(Math.max(fat?e.fat:state.goalStartWeight,...rows.map(r=>r.hi))+1),x=i=>42+i/52*600,y=v=>200-(v-lo)/(hi-lo)*165;return `<svg class="chart" viewBox="0 0 680 235" role="img" aria-label="52-Wochen-Szenario zum ${fat?'Körperfett':'Gewichts'}ziel">${[0,.5,1].map(f=>{let v=lo+(hi-lo)*f;return `<line x1="42" x2="642" y1="${y(v)}" y2="${y(v)}" stroke="#3d3248"/><text x="0" y="${y(v)+4}" class="chart-label">${fmt(v,0)}</text>`}).join('')}<polygon points="${[...rows.map((r,i)=>`${x(i)},${y(r.lo)}`),...rows.map((r,i)=>`${x(i)},${y(r.hi)}`).reverse()].join(' ')}" fill="#b699ff" opacity=".13"/><line x1="42" x2="642" y1="${y(target)}" y2="${y(target)}" stroke="#a6e3bc" stroke-dasharray="5 5"/><text x="640" y="${y(target)-7}" text-anchor="end" fill="#a6e3bc" font-size="13">Ziel ${fmt(target)} ${fat?'%':'kg'}</text><polyline points="${rows.map((r,i)=>`${x(i)},${y(r.v)}`).join(' ')}" fill="none" stroke="#c3a3ff" stroke-width="3"/><circle cx="42" cy="${y(rows[0].v)}" r="4" fill="#a6e3bc"/>${[0,26,52].map(i=>`<text x="${x(i)}" y="228" text-anchor="middle" class="chart-label">${monthLabel(add(e.date,i*7))}</text>`).join('')}</svg>`}
function bigGoalPanel(type){let fat=type==='fat',v=fat?state.goalFat:state.target,a=arrival(v,type),e=last();return `<section class="card big-goal"><div class="eyebrow">${fat?'ERSTES GROSSES KFA-ZIEL':'DEIN GEWICHTSZIEL'}</div><div class="row"><h2>${fat?`${fmt(e.fat)} % → <strong>${fmt(v,0)} %</strong>`:`${fmt(state.goalStartWeight,0)} kg → <strong>${fmt(v,0)} kg</strong>`}</h2><button class="subtle" onclick="goalForm()">Ändern</button></div><p class="goal-arrival">${a.reached?'Laut letztem Messwert erreicht':`Mittleres Szenario: <b>${monthLabel(a.mid)}</b>`}</p>${focusGoalChart(type)}<p class="hint">${fat?'KFA aus konstanter fettfreier Masse abgeleitet.':'Aktueller Messwert: '+fmt(e.weight,2)+' kg; 95 kg ist dein Ausgangs-Zielrahmen.'} Zeitkorridor: ${monthLabel(a.early)} – ${monthLabel(a.late)}.</p><button onclick="goalDetails(${v},'${type}')">Prognose & Annahmen →</button></section>`}

</script><script>// Mobile-first interaction layer. One reference weight and completion flag per exercise/date.

function exerciseOverview(s){let p=workoutProgress(selectedDay);return `<div class="exercise-overview touch-exercises"><div class="row"><div class="eyebrow">DEINE ÜBUNGEN</div><span class="exercise-count">${p.done}/${p.total} erledigt · ${p.left} offen</span></div>${exerciseRows(selectedDay)}<p class="hint exercise-save-hint">Ein grober Gewichtswert je Übung. Automatisch gespeichert, frühere Werte als Orientierung vorbefüllt.</p></div>`}
function gymDetail(d){let s=session(d),p=workoutProgress(d);activeTrainingDay=d;$('#modalbody').innerHTML=`<form method="dialog" class="dialog-dismiss"><button type="submit" class="close" aria-label="Training schließen">×</button></form><div class="eyebrow">${dayNames[(new Date(d+'T12:00:00').getDay()+6)%7]} · ${date(d)}</div><h2>${s.type==='gym'?'GYM | '+s.name:s.name}</h2><div class="workout-progress"><b>${p.done}/${p.total} erledigt</b><span>${p.left?p.left+' Übungen noch offen':'✓ Training vollständig erledigt'}</span></div><div class="progress"><div style="width:${p.done/p.total*100}%"></div></div><p class="hint">Ein Gewichtswert pro Übung, keine Satzliste. Der letzte frühere Wert derselben Übung und Trainingsart ist vorbefüllt. Bei Abweichung ändern; 0 kg ist ohne Zusatzgewicht. Gewicht und Haken werden direkt gespeichert.</p><div class="full-workout-list">${exerciseRows(d,true)}</div><details class="workout-notes"><summary>Notiz zu dieser Einheit</summary><label>Trainingseindruck<textarea id="workoutNote" rows="3" maxlength="2000">${esc(state.logs[d]?.note||'')}</textarea></label><button onclick="saveWorkoutNote('${d}')">Notiz speichern</button></details><p class="hint">Die Haken gelten nur für diesen Tag. Beim nächsten Training beginnt die Checkliste wieder offen; die früheren Gewichte bleiben als Orientierung erhalten.</p>`;if(!$('#modal').open)$('#modal').showModal()}

validateImport=function(s){importBefore5(s);if(s.exerciseLog!==undefined){if(!s.exerciseLog||typeof s.exerciseLog!=='object'||Array.isArray(s.exerciseLog))throw Error();let keys=new Set(Object.entries(splitPlan).flatMap(([plan,names])=>names.map(n=>exerciseKey(plan,n))));for(let [d,rows] of Object.entries(s.exerciseLog)){if(!validDate(d)||!rows||typeof rows!=='object'||Array.isArray(rows))throw Error();for(let [k,v] of Object.entries(rows))if(!keys.has(k)||!v||typeof v.done!=='boolean'||(v.weight!==null&&(!Number.isFinite(v.weight)||v.weight<0||v.weight>500)))throw Error()}}return s};
