function trainingRows(){return Array.from({length:7},(_,i)=>{let d=add(week,i),s=session(d);return `<div class="training"><span class="day">${['MO','DI','MI','DO','FR','SA','SO'][i]}</span><div><b>${s.name}</b><span class="meta">${s.sub}</span></div><button class="${state.done[d]?'completed':'subtle'}" onclick="sessionDetail('${d}')">${state.done[d]?'✓ Erledigt':'Details ↗'}</button></div>`}).join('')}
function forecastAt(d){let e=last(),days=Math.max(0,(new Date(d+'T12:00:00')-new Date(e.date+'T12:00:00'))/86400000),weeks=days/7,loss=0;for(let i=1;i<=Math.ceil(days);i++){let dt=add(e.date,i),factor=1;if(state.holiday&&dt.slice(5)>='12-20'&&dt.slice(5)<='12-31')factor=0;for(let ev of state.events){if(dt>=ev.start&&dt<=ev.end)factor=Math.min(factor,{ill:0,plateau:0,food:.5}[ev.type])}loss+=state.rate/7*factor*Math.max(.65,1-i/1500)}let weight=Math.max(state.target,e.weight-loss),spread=.6+.2*Math.sqrt(weeks)+.05*weeks;let lean=e.weight*(1-e.fat/100),fat=100*(1-lean/weight);return {d,weight,low:Math.max(state.target-1,weight-spread),high:weight+spread,fat:Math.max(5,fat),fatBand:3+weeks*.06}}
function forecasts(){let e=last();return Array.from({length:17},(_,i)=>forecastAt(add(e.date,7*i)))}
function chart(){let data=forecasts(),hist=[...state.entries].filter(e=>e.date<=today()).sort((a,b)=>a.date.localeCompare(b.date)),origin=hist[0].date,end=data.at(-1).d,all=[...hist.map(e=>e.weight),...data.flatMap(e=>[e.low,e.high])],lo=Math.floor(Math.min(...all)-1),hi=Math.ceil(Math.max(...all)+1),x=d=>45+(new Date(d)-new Date(origin))/(new Date(end)-new Date(origin))*620,y=v=>210-(v-lo)/(hi-lo)*175,points=data.map(e=>`${x(e.d)},${y(e.weight)}`).join(' '),band=[...data.map(e=>`${x(e.d)},${y(e.low)}`),...data.toReversed().map(e=>`${x(e.d)},${y(e.high)}`)].join(' ');return `<svg class="chart" viewBox="0 0 700 250" role="img" aria-label="Gewichtshistorie und Szenario mit Unsicherheitsband">${Array.from({length:5},(_,i)=>{let v=lo+(hi-lo)*i/4;return `<line x1="45" x2="665" y1="${y(v)}" y2="${y(v)}" stroke="#322e3e"/><text x="0" y="${y(v)+4}" class="chart-label">${fmt(v,0)}</text>`}).join('')}<polygon points="${band}" fill="#b699ff" opacity=".12"/><polyline points="${points}" fill="none" stroke="#b699ff" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="${hist.map(e=>`${x(e.date)},${y(e.weight)}`).join(' ')}" fill="none" stroke="#a6e3bc" stroke-width="3"/>${hist.map(e=>`<circle cx="${x(e.date)}" cy="${y(e.weight)}" r="4" fill="#a6e3bc"><title>${date(e.date)}: ${fmt(e.weight)} kg</title></circle>`).join('')}${[0,4,8,12,16].map(i=>`<text x="${x(data[i].d)}" y="239" text-anchor="middle" class="chart-label">${date(data[i].d).slice(0,7)}</text>`).join('')}</svg><div class="legend"><span><i style="background:#a6e3bc"></i>Gemessen</span><span><i></i>Szenario</span><span>Fläche: plausible Bandbreite*</span></div>`}
function overview(){let e=last(),s=session(today()),progress=Math.min(100,Math.max(0,(94.6-e.weight)/(94.6-state.target)*100));return heading('BUILD YOUR NEXT CHAPTER','Dein Fortschritt. Dein Projekt.','Ein Plan, der zu deinem Leben passt.',`<button class="primary" onclick="entryForm()">＋ Wochen-Check-in</button>`)+`<div class="grid stats">${metric('Körpergewicht',fmt(e.weight,2),'kg',`Start 94,60 kg · ${fmt(e.weight-94.6)} kg`)}${metric('Körperfett',fmt(e.fat),'%', 'Waagenwert · Messunsicherheit beachten')}${metric('Body Mass Index',fmt(e.weight/state.height**2),'BMI',`${fmt(state.height*100,0)} cm · aus aktuellem Gewicht`)}${metric('Diese Woche',Object.keys(state.done).filter(d=>d>=week&&d<=add(week,6)&&state.done[d]&&session(d).type!=='rest').length,'/ 6',`Trainingswoche ${weekType(week)} · inkl. Ausdauer`)}</div><div class="grid two"><section class="card"><div class="row"><h2>Die Richtung stimmt.</h2><button class="subtle" onclick="go('forecast')">Prognose öffnen ↗</button></div>${chart()}<div class="notice">*Illustratives Szenario, kein statistisches Konfidenzintervall. Einzelne Messungen schwanken; Trends brauchen mehrere Wochen.</div></section><section class="card hero"><div class="eyebrow">DEIN FOKUS HEUTE · ${date(today())}</div><h2>${s.name}<br><span class="purple">Bleib in Bewegung.</span></h2><p>${s.sub}. Dein Plan ist eine Orientierung. Passe die Belastung an deine Erholung an.</p><button class="primary" onclick="sessionDetail('${today()}')">Training ansehen ↗</button><div class="progress"><div style="width:${progress}%"></div></div><div class="hint">${fmt(progress,0)} % zum frei gewählten Etappenziel ${fmt(state.target)} kg</div><button class="subtle" onclick="go('settings')">Etappenziel ändern</button></section></div><div class="grid two"><section class="card"><div class="row"><h2>Deine Trainingswoche</h2><button class="subtle" onclick="go('training')">Plan öffnen ↗</button></div>${trainingRows()}</section><section class="card"><h2>Heute zählt.</h2>${dailyTasks(today())}<div class="notice">Nächster Check-in: ${date(add(last().date,7))}<br>Möglichst morgens unter ähnlichen Bedingungen messen.</div><button onclick="go('nutrition')">Schnelle Mahlzeit erfassen ↗</button></section></div>`}
function entryForm(d){let e=state.entries.find(e=>e.date===d)||{date:today(),weight:last().weight,fat:last().fat,note:''};modal(`<h2>Dein Wochen-Check-in</h2><p>Ein Messpunkt, kein Urteil. Einträge am selben Tag werden ersetzt.</p><form id="entry"><div class="fields"><label>Datum<input name="date" type="date" required max="${today()}" value="${e.date}"></label><label>Gewicht · kg<input name="weight" type="number" min="40" max="250" step=".01" required value="${e.weight}"></label><label>KFA · % (Waage)<input name="fat" type="number" min="3" max="65" step=".1" required value="${e.fat}"></label><label>Notiz<input name="note" maxlength="500" value="${esc(e.note)}"></label></div><div class="actions"><button class="primary">Eintrag speichern</button></div></form>`);$('#entry').onsubmit=ev=>{ev.preventDefault();let f=new FormData(ev.target),n={date:f.get('date'),weight:+f.get('weight'),fat:+f.get('fat'),note:f.get('note')};state.entries=state.entries.filter(x=>x.date!==n.date&&x.date!==d);state.entries.push(n);state.entries.sort((a,b)=>a.date.localeCompare(b.date));save();closeAthleticDialog();render();toast('Check-in gespeichert')};}
const exercises={Push:['Brustpresse / Bankdrücken · 3 × 6–10','Schrägbankdrücken · 2 × 8–12','Schulterdrücken · 2 × 8–12','Seitheben · 3 × 12–20','Trizeps am Kabel · 2 × 10–15'],'Pull + Legs':['Beinpresse / Kniebeuge · 3 × 6–10','Rumänisches Kreuzheben · 2 × 8–10','Latzug · 3 × 8–12','Rudern · 3 × 8–12','Beinbeuger · 2 × 10–15','Bizeps · 2 × 10–15']};
function sessionDetail(d){let s=session(d),log=state.logs[d]||{};modal(`<div class="eyebrow">${date(d)} · WOCHE ${weekType(d)}</div><h2>${s.type==='gym'?'GYM | '+s.name:s.name}</h2><p>${s.sub}</p>${(exercises[s.name]||[s.type==='bike'?'45–60 Minuten locker, Intensität über Sprechtest steuern.':s.type==='run'?`${fmt(state.runKm)} km entspannt. Bei Bedarf Gehpausen. Erst bei guter Erholung um 0,5 km steigern; Distanz in Einstellungen ändern.`:'Erholung priorisieren. Ein lockerer Spaziergang ist optional.']).map(x=>`<div class="event">${x}</div>`).join('')}<p class="hint">Gym: 5–10 Min aufwärmen, 1–3 Wiederholungen im Tank lassen. Technik vor Last. Bei Krankheit pausieren; Wiedereinstieg nach Erholung behutsam.</p><form id="sessionForm"><label>Deine Notizen / Gewichte / Distanz<textarea name="note" rows="3" maxlength="2000">${esc(log.note||'')}</textarea></label><label>Dauer · Minuten<input name="minutes" type="number" min="0" max="300" value="${log.minutes||''}"></label><label class="check"><input type="checkbox" name="done" ${state.done[d]?'checked':''}>Einheit abgeschlossen</label><button class="primary">Training speichern</button></form>`);$('#sessionForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);state.logs[d]={note:f.get('note'),minutes:+f.get('minutes')};state.done[d]=f.has('done');save();closeAthleticDialog();render();toast('Training gespeichert')}}
function training(){return heading('KRAFT × AUSDAUER','Deine Woche hat Struktur.','Push und Pull + Legs rotieren über die Wochengrenze.')+`<div class="card">${weekControl()}${trainingRows()}</div><div class="grid three" style="margin-top:20px"><div class="card"><h2>Rotation A / B</h2><p>A: Mo Push · Mi Pull + Legs · Fr Push<br>B: Mo Pull + Legs · Mi Push · Fr Pull + Legs</p><p class="hint">Startanker: ${date(state.anchor)} = Woche A. Auch über den Jahreswechsel fortlaufend.</p></div><div class="card"><h2>Ausdauer mit Gefühl</h2><p>Di / Do Indoor-Rad 45–60 Min. Am Wochenende ein lockerer Lauf; Start bei 5 km. Richtung 10 km nur schrittweise und ohne Zeitdruck.</p><button onclick="go('settings')">Lauftag & Distanz ändern</button></div><div class="card"><h2>Progression</h2><p>Wenn alle Sätze kontrolliert am oberen Wiederholungsende gelingen, beim nächsten Mal die kleinste Laststufe erhöhen. Belastung und Erholung in den Trainingsnotizen festhalten.</p></div></div>`}
const meals=[{name:'Chicken Potato Bowl',icon:'◒',kcal:820,p:65,items:[['Hähnchen',250,'g'],['Kartoffeln',400,'g'],['TK-Gemüse',300,'g'],['Skyr',100,'g'],['Öl',15,'g']],recipe:'Kartoffeln würfeln und 20–25 Min garen. Hähnchen vollständig durchgaren, Gemüse erhitzen. Skyr mit Gewürzen als Dip. Rohgewichte; Öl mitmessen.'},{name:'Beef Rice · Sweet & Sour',icon:'◈',kcal:920,p:57,items:[['Mageres Rinderhack',250,'g'],['Mikrowellenreis',250,'g'],['TK-Gemüse',300,'g'],["Uncle Ben’s Süß-Sauer ohne Zuckerzusatz",100,'g']],recipe:'Hack vollständig durchbraten, Gemüse und Sauce erhitzen, Reis nach Packung erwärmen. Reis als Packungsgewicht, Hack roh. Sauce nach Verfügbarkeit, Werte vom Etikett prüfen.'},{name:'Chicken Skyr Wraps',icon:'◎',kcal:850,p:70,items:[['Hähnchen',250,'g'],['Wraps',2,'Stück'],['TK-Gemüse',250,'g'],['Skyr',150,'g'],['Öl',10,'g']],recipe:'Hähnchen und Gemüse durchgaren, Wraps erwärmen. Skyr würzen, füllen und rollen. Wrap-Größen variieren: Packungsangaben übernehmen.'},{name:'Frosta · Feierabend',icon:'❋',kcal:750,p:35,items:[['Frosta-Pfanne',500,'g'],['Skyr',250,'g']],recipe:'Frosta nach Packungsanleitung zubereiten, Skyr separat als Dessert. Kalorien hängen stark von der Sorte ab; hier nur ein Platzhalter-Schätzwert.'},{name:'Optional: Skyr & Banane',icon:'◡',kcal:300,p:33,items:[['Skyr',300,'g'],['Bananen',1,'Stück']],recipe:'Skyr mit Banane kombinieren. Frühstück ist optional. Ohne Frühstück die Tagesmenge über zwei größere Hauptmahlzeiten und bei Bedarf Snacks verteilen.'}];
let foodDate=today();function foodLog(){return state.logs['food-'+foodDate]||[]}
function nutrition(){let logs=foodLog(),sum=logs.reduce((s,x)=>s+x.kcal,0);return heading('EINFACH ESSEN. DRANBLEIBEN.','Zwei Mahlzeiten. Viel Spielraum.','Lidl-Favoriten, schnelle Gerichte und Meal Prep am Sonntag & Mittwoch.')+`<div class="card"><div class="row"><div><div class="label">Hybrides Tages-Tracking</div><div class="metric">${fmt(sum,0)} <small>/ ${state.kcal} kcal · Planwert</small></div></div><label>Tag<input type="date" value="${foodDate}" onchange="foodDate=this.value;render()"></label></div><div class="progress"><div style="width:${Math.min(100,sum/state.kcal*100)}%"></div></div><p class="hint">2 Hauptmahlzeiten à grob 850–1.000 kcal, Rest flexibel für Frühstück, Skyr oder Snacks. 2.400 kcal ist ein editierbarer Testwert, kein berechneter Bedarf. Grundumsatz laut dir: 2.100–2.300 kcal; Gesamtverbrauch noch unbekannt. Etikettwerte haben Vorrang vor Rezeptschätzungen.</p><div class="actions"><button onclick="customFood()">＋ Kalorien / Produkt manuell</button><button onclick="shopping()">Einkaufsliste öffnen ↗</button><button onclick="prep()">Meal Prep So / Mi ↗</button><button onclick="go('settings')">Tagesplanwert ändern</button></div>${logs.map((l,i)=>`<div class="training"><div><b>${esc(l.name)}</b><span class="meta">${l.kcal} kcal · ${l.p||0} g Protein · ${l.estimated?'geschätzt':'manuell'}</span></div><button class="subtle" onclick="removeFood(${i})" aria-label="Mahlzeit entfernen">Entfernen</button></div>`).join('')}</div><div class="grid three" style="margin-top:20px">${meals.map((m,i)=>`<div class="card"><span class="meal-icon purple">${m.icon}</span><div class="eyebrow">${i===4?'FRÜHSTÜCK OPTIONAL':'HAUPTMAHLZEIT · 15–30 MIN'}</div><h2>${m.name}</h2><p>≈ ${m.kcal} kcal · ≈ ${m.p} g Protein</p><div class="actions"><button class="primary" onclick="logMeal(${i})">＋ 1 Portion</button><button onclick="mealDetail(${i})">Rezept & Portion</button></div></div>`).join('')}</div>`}
function logMeal(i,mult=1){let m=meals[i],key='food-'+foodDate;state.logs[key]??=[];state.logs[key].push({name:m.name,kcal:Math.round(m.kcal*mult),p:Math.round(m.p*mult),estimated:true});save();render();toast('Mahlzeit erfasst – im Tageslog korrigierbar')}
function removeFood(i){state.logs['food-'+foodDate].splice(i,1);save();render()}
function mealDetail(i){let m=meals[i];modal(`<h2>${m.name}</h2><p>${m.recipe}</p>${m.items.map(x=>`<div class="training">${x[1]} ${x[2]} ${x[0]}</div>`).join('')}<p class="hint">Grobe Rezeptschätzung, keine verifizierten Lidl-Produktwerte. Gewichte, Marke und Zubereitung beeinflussen die Nährwerte.</p><label>Portionsfaktor<input id="portion" type="number" value="1" min=".25" max="3" step=".25"></label><div class="actions"><button class="primary" onclick="let v=+document.querySelector('#portion').value;if(v>=.25&&v<=3){logMeal(${i},v);closeAthleticDialog()}">Portion erfassen</button><button onclick="closeAthleticDialog();customFood('${m.name}',${m.kcal},${m.p})">Etikettwerte eintragen</button></div>`)}
function customFood(name='',kcal='',p=''){modal(`<h2>Manuell erfassen</h2><form id="food"><label>Produkt / Mahlzeit<input name="name" required maxlength="100" value="${esc(name)}"></label><div class="fields"><label>Kalorien der gegessenen Menge<input name="kcal" type="number" min="0" max="5000" required value="${kcal}"></label><label>Protein · g<input name="p" type="number" min="0" max="400" value="${p}"></label></div><div class="actions"><button class="primary">Speichern</button></div></form>`);$('#food').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),key='food-'+foodDate;state.logs[key]??=[];state.logs[key].push({name:f.get('name'),kcal:+f.get('kcal'),p:+f.get('p'),estimated:false});save();closeAthleticDialog();render()}}
function shopping(){let list={};for(let i=0;i<7;i++)for(let m of [meals[i%4],meals[(i+1)%4]])for(let [n,q,u] of m.items){list[n]??={q:0,u};list[n].q+=q}modal(`<h2>Einkauf für 7 Tage</h2><p>14 Hauptmahlzeiten nach der Beispielrotation. Frühstück / Snacks zusätzlich einplanen. Frischware passend zu So / Mi kaufen.</p>${Object.entries(list).map(([n,v])=>`<label class="check"><input type="checkbox" ${state.tasks['shop-'+n]?'checked':''} onchange="state.tasks['shop-'+esc(n) +"']=this.checked;save()">${esc(n)} · ${v.q} ${v.u}</label>`).join('')}<p class="hint">Mengen entsprechen den Roh-/Packungsgewichten der Rezepte; keine aktuellen Lidl-Preise oder Verfügbarkeitsdaten.</p>`)}
function prep(){modal(`<h2>Meal Prep · So / Mi</h2><p>Sonntag: 3 Tage vorbereiten. Mittwoch: 4 Tage planen; spätere Portionen zeitnah einfrieren.</p>${['Einkauf prüfen & Portionen planen','Kartoffeln / Reis vorbereiten','Hähnchen und Hack vollständig durchgaren','Gemüse garen, Skyr-Dip separat','Zügig abkühlen, datieren und kalt lagern','Spätere Portionen einfrieren; gründlich wieder erhitzen'].map((s,i)=>`<label class="check"><input type="checkbox" ${state.tasks[today()+'prep'+i]?'checked':''} onchange="state.tasks['${today()}prep${i}']=this.checked;save()">${s}</label>`).join('')}<p class="hint">Keine Woche vorgekochte Reis-/Fleischgerichte ungekühlt lagern. Haltbarkeit nach Zutaten und Kühlkette beurteilen.</p>`)}
function forecast(){let fs=forecasts(),months=[],base=last().date;for(let i=0;i<5;i++){let d=new Date(base+'T12:00:00');d.setMonth(d.getMonth()+i+1,1);months.push(forecastAt(iso(d)))}return heading('RICHTUNG STATT VERSPRECHEN','Fortschritt mit Spielraum.','Wöchentliche Szenarien und jeder Monatsanfang – mit Platz für das echte Leben.')+`<div class="grid two"><section class="card"><h2>Dein 16-Wochen-Ausblick</h2>${chart()}<div class="notice">Kein kalibriertes Vorhersagemodell. Mittellinie: editierbare Verlustrate mit sanfter Abflachung, am Etappenziel gestoppt. Band: ± (0,6 + 0,2√Wochen + 0,05×Wochen) kg. Das sind bewusst gewählte Modellannahmen, keine Wahrscheinlichkeiten.</div><p class="hint">KFA wird illustrativ mit konstant gehaltener fettfreier Masse aus dem letzten Messwert abgeleitet; Muskel-, Wasser- und Messänderungen können das deutlich verfälschen. KFA-Band ± (3 + 0,06×Wochen) Prozentpunkte, kein garantierter Messfehler. Nach jedem Check-in startet das Szenario neu.</p></section><section class="card"><h2>Deine Annahmen</h2><label>Verlustrate pro Woche · <b>${fmt(state.rate)} kg</b><input type="range" min="0" max=".75" step=".05" value="${state.rate}" onchange="state.rate=+this.value;save();render()"></label><p class="hint">Startannahme 0,4 kg/Woche, nicht aus dem Grundumsatz errechnet. Erst nach mehreren vergleichbaren Wochen anpassen.</p><label class="check"><input type="checkbox" ${state.holiday?'checked':''} onchange="state.holiday=this.checked;save();render()">20.–31. Dezember: Gewicht halten</label><p class="hint">Ein Essen entscheidet keinen Verlauf. Ausnahmen werden als verlangsamte Wochen modelliert, ohne Strafsport oder Kompensation.</p><button onclick="eventForm()">＋ Krankheit / Plateau / Essensausnahme</button>${state.events.map((e,i)=>`<div class="event"><b>${{ill:'Erholung / Krankheit',plateau:'Plateau',food:'Essensausnahmen'}[e.type]}</b><p class="hint">${date(e.start)} – ${date(e.end)}</p><button class="subtle" onclick="state.events.splice(${i},1);save();render()">Entfernen</button></div>`).join('')}</section></div><section class="card" style="margin-top:20px"><h2>Am Anfang des Monats</h2>${forecastTable(months)}</section><section class="card" style="margin-top:20px"><h2>Woche für Woche</h2>${forecastTable(fs.slice(1))}</section><section class="card" style="margin-top:20px"><h2>Messhistorie</h2>${history()}</section>`}
function forecastTable(rows){return `<div class="table-wrap"><table><thead><tr><th>Datum</th><th>Gewicht · Szenario</th><th>Gewichtsband</th><th>KFA · illustrativ</th></tr></thead><tbody>${rows.map(e=>`<tr><td>${date(e.d)}</td><td>${fmt(e.weight)} kg</td><td>${fmt(e.low)}–${fmt(e.high)} kg</td><td>${fmt(e.fat)} % · ${fmt(Math.max(3,e.fat-e.fatBand))}–${fmt(Math.min(65,e.fat+e.fatBand))} %</td></tr>`).join('')}</tbody></table></div>`}
function eventForm(){modal(`<h2>Das Leben mit einplanen</h2><form id="eventForm"><label>Szenario<select name="type"><option value="ill">Krankheit – kein geplanter Gewichtsverlust</option><option value="plateau">Plateau – kein geplanter Gewichtsverlust</option><option value="food">Essensausnahmen – halbe Verlustrate</option></select></label><div class="fields"><label>Von<input name="start" type="date" required value="${today()}"></label><label>Bis<input name="end" type="date" required value="${add(today(),6)}"></label></div><p class="hint">Annahme für die Prognose; verändert deinen Trainingskalender nicht automatisch. Bei Krankheit Training separat anpassen. Überlappende Szenarien werden nicht doppelt gezählt.</p><button class="primary">Szenario speichern</button></form>`);$('#eventForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(f.get('end')<f.get('start'))return toast('Enddatum muss nach dem Start liegen');state.events.push(Object.fromEntries(f));save();closeAthleticDialog();render()}}
function history(){return `<div class="table-wrap"><table><thead><tr><th>Datum</th><th>Gewicht</th><th>KFA</th><th>Notiz</th><th>Aktion</th></tr></thead><tbody>${state.entries.toReversed().map(e=>`<tr><td>${date(e.date)}</td><td>${fmt(e.weight,2)} kg</td><td>${fmt(e.fat)} %</td><td>${esc(e.note)}</td><td><button class="subtle" onclick="entryForm('${e.date}')">Bearbeiten</button><button class="subtle danger" onclick="deleteEntry('${e.date}')">Löschen</button></td></tr>`).join('')}</tbody></table></div><button class="primary" style="margin-top:15px" onclick="entryForm()">＋ Check-in</button>`}
function deleteEntry(d){if(state.entries.length===1)return toast('Mindestens ein Messpunkt bleibt erhalten');modal(`<h2>Messpunkt löschen?</h2><p>${date(d)} wird aus der Historie entfernt.</p><button class="danger" onclick="state.entries=state.entries.filter(e=>e.date!=='${d}');save();closeAthleticDialog();render()">Endgültig löschen</button>`)}
function dailyTasks(d){let list=['Zwei Hauptmahlzeiten planen','Erholung & Körpergefühl prüfen'];if([2,6].includes((new Date(d+'T12:00:00').getDay()+6)%7))list.push('Meal Prep vorbereiten');if(d===add(last().date,7))list.push('Wochen-Check-in eintragen');return list.map((x,i)=>`<label class="check"><input type="checkbox" ${state.tasks[d+'-'+i]?'checked':''} onchange="state.tasks['${d}-${i}']=this.checked;save()">${x}</label>`).join('')+`<label class="check"><input type="checkbox" ${state.tasks[d+'photo']?'checked':''} onchange="state.tasks['${d}photo']=this.checked;save()">Optional: Wochenfoto aufnehmen</label>`}
function calendar(){return heading('EIN TAG NACH DEM ANDEREN','Platz für dein echtes Leben.','Training, Meal Prep und kleine Schritte in einer Woche.')+`<div class="card">${weekControl()}</div><div class="grid calendar" style="margin-top:20px">${Array.from({length:7},(_,i)=>{let d=add(week,i),s=session(d);return `<div class="card"><div class="eyebrow">${['MONTAG','DIENSTAG','MITTWOCH','DONNERSTAG','FREITAG','SAMSTAG','SONNTAG'][i]}</div><h3>${date(d)}</h3><div class="event">${s.name}</div>${[2,6].includes(i)?'<div class="event purple">Meal Prep</div>':''}<button onclick="sessionDetail('${d}')">Training ${state.done[d]?'✓':'öffnen'}</button><button onclick="dayDetail('${d}')">To-dos & Tagesnotiz</button></div>`}).join('')}</div>`}
function dayDetail(d){modal(`<h2>${date(d)}</h2>${dailyTasks(d)}<label>Tagesnotiz<textarea id="daynote" rows="4" maxlength="2000">${esc(state.logs['day-'+d]||'')}</textarea></label><div class="actions"><button class="primary" onclick="state.logs['day-${d}']=document.querySelector('#daynote').value;save();closeAthleticDialog();toast('Tagesnotiz gespeichert')">Notiz speichern</button><button onclick="foodDate='${d}';closeAthleticDialog();go('nutrition')">Ernährung dieses Tages</button></div>`)}
function story(){return heading('MEHR ALS EINE ZAHL','Deine Transformation.','Wöchentliche Bilder und die Geschichte hinter deinem Fortschritt.',`<button class="primary" onclick="photoForm()">＋ Wochenfoto</button>`)+`<div class="grid two"><div class="card hero"><div class="eyebrow">DEIN NÄCHSTES KAPITEL</div><h2>Stärker werden.<br>Schritt für Schritt.</h2><p>Start: 94,60 kg · 28,1 % KFA. Halte neben Zahlen auch fest, was leichter wird: Treppen, Training, Schlaf oder dein erster entspannter 10-km-Lauf.</p><label>Deine laufende Story<textarea id="storytext" rows="6" maxlength="10000" placeholder="Was hat diese Woche gut funktioniert? Was brauchst du nächste Woche?">${esc(state.story)}</textarea></label><button style="margin-top:12px" onclick="state.story=document.querySelector('#storytext').value;save();toast('Story gespeichert')">Story speichern</button></div><div class="card"><h2>Dein Story-Konzept</h2><p>01 · Ausgangspunkt: Warum Fitness-Schmalle?<br>02 · Woche für Woche: Foto, Kraft, Ausdauer, Alltag.<br>03 · Echte Wendepunkte: Erholung, Weihnachten, Neustart.<br>04 · Rückblick: Was hat sich außer Gewicht verändert?</p><div class="notice">Fotos sind freiwillig. Ähnliche Kleidung, Perspektive und Licht machen Vergleiche hilfreicher. Deine Bilder bleiben in diesem Browser und sind im Backup enthalten.</div><button onclick="exportData()">Story & Daten sichern</button></div></div><div class="grid three" style="margin-top:20px">${state.photos.length?state.photos.toReversed().map((p)=>`<div class="card"><img class="photo" src="${p.src}" alt="Persönliches Fortschrittsfoto vom ${date(p.date)}"><h3 style="margin-top:16px">${date(p.date)}</h3><p>${esc(p.note)}</p><button class="subtle danger" onclick="deletePhoto('${p.id}')">Foto entfernen</button></div>`).join(''):'<div class="empty" style="grid-column:1/-1">Deine Geschichte beginnt hier. Füge dein erstes Wochenfoto hinzu.</div>'}</div>`}
function photoForm(){modal(`<h2>Ein Moment deines Wegs</h2><form id="photoform"><label>Datum<input name="date" type="date" required value="${today()}"></label><label>Foto · JPG, PNG oder WebP<input name="image" type="file" accept="image/jpeg,image/png,image/webp" required></label><label>Dein Wochenmoment<input name="note" maxlength="500" placeholder="Mehr Energie, erster guter Lauf …"></label><p class="hint">Das Bild wird für lokale Speicherung auf maximal 1.000 Pixel verkleinert. Speicherplatz ist browserabhängig. Original separat behalten.</p><button class="primary">Foto speichern</button></form>`);$('#photoform').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),file=f.get('image');if(file.size>15000000)return toast('Bitte ein Bild unter 15 MB wählen');try{let bitmap=await createImageBitmap(file),scale=Math.min(1,1000/Math.max(bitmap.width,bitmap.height)),c=document.createElement('canvas');c.width=bitmap.width*scale;c.height=bitmap.height*scale;c.getContext('2d').drawImage(bitmap,0,0,c.width,c.height);let p={id:crypto.randomUUID(),date:f.get('date'),note:f.get('note'),src:c.toDataURL('image/jpeg',.72)};state.photos.push(p);if(!save()){state.photos.pop();return}closeAthleticDialog();render();toast('Wochenfoto gespeichert')}catch{toast('Dieses Bild konnte nicht geladen werden')}}}
function deletePhoto(id){modal(`<h2>Foto entfernen?</h2><p>Das Foto wird aus der lokalen App entfernt.</p><button class="danger" onclick="state.photos=state.photos.filter(p=>p.id!=='${id}');save();closeAthleticDialog();render()">Foto löschen</button>`)}
function exportData(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='athletic-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Backup wird heruntergeladen')}
function settings(){return heading('DEIN PROJEKT. DEINE DATEN.','Alles unter deiner Kontrolle.','Lokal gespeichert – mit Export und Wiederherstellung.')+`<div class="grid two"><section class="card"><h2>Plan anpassen</h2><form id="settings"><div class="fields"><label>Größe · cm<input name="height" type="number" min="140" max="220" step=".1" required value="${state.height*100}"></label><label>Etappenziel · kg<input name="target" type="number" min="70" max="94" step=".1" required value="${state.target}"></label><label>Woche A beginnt am Montag<input name="anchor" type="date" required value="${state.anchor}"></label><label>Lauftag<select name="runDay"><option value="5" ${state.runDay==5?'selected':''}>Samstag</option><option value="6" ${state.runDay==6?'selected':''}>Sonntag</option></select></label><label>Aktuelle Laufdistanz · km<input name="runKm" type="number" min="5" max="10" step=".5" required value="${state.runKm}"></label><label>Tagesplan · kcal (Testwert)<input name="kcal" type="number" min="1800" max="4000" step="50" required value="${state.kcal}"></label><label>Gesamtverbrauch · kcal (optional)<input name="tdee" type="number" min="1800" max="5500" step="50" value="${state.tdee||''}" placeholder="Noch unbekannt"></label></div><p class="hint">Grundumsatz 2.100–2.300 kcal ist deine Angabe. Gesamtverbrauch enthält zusätzlich Alltag und Training. Der optionale Verbrauchswert ist eine eigene Schätzung und steuert die Prognose nicht automatisch. Zielgewicht ist ein frei gesetztes Etappenziel, keine medizinische Empfehlung. Ohne Alter, Geschlecht und Verlauf wird kein sicherer KFA-Zielkorridor behauptet.</p><button class="primary">Einstellungen speichern</button></form></section><section class="card"><h2>Backup & Privatsphäre</h2><p>Messungen, Mahlzeiten, Trainingsnotizen, To-dos und Fotos werden im lokalen Browserspeicher dieser Adresse gespeichert. Kein Konto, keine geräteübergreifende Synchronisation. Beim Löschen der Browserdaten gehen sie verloren.</p><div class="notice">${storageOK?'Lokaler Speicher verfügbar.':'Speicher konnte nicht geschrieben/gelesen werden. Exportiere jetzt dein Backup.'} Regelmäßig exportieren, besonders nach Fotos. Ein Adress- oder Browserwechsel braucht einen Import.</div><button onclick="exportData()">↓ Vollständiges Backup exportieren</button><label style="margin-top:20px">Backup importieren (ersetzt lokale Daten)<input id="import" type="file" accept="application/json,.json"></label><p class="hint">Die App nutzt lokale Systemschriften und mitgelieferte Bilder. Gesundheitsdaten werden von der App nicht an einen Server gesendet.</p><button class="danger" onclick="resetDialog()">Lokale Daten zurücksetzen</button></section></div><section class="card" style="margin-top:20px"><h2>Quellen & Grenzen</h2><p class="hint">Das Dashboard unterstützt Planung und Selbstbeobachtung. Die Prognose ist eine transparente Illustration, kein validiertes NIDDK-Modell. Körperfettwaagen sind für einzelne absolute Werte begrenzt aussagekräftig; Hydration und Messbedingungen mitdenken. Krankheit und stärkere Beschwerden haben Vorrang vor dem Plan.</p><p><a href="https://www.niddk.nih.gov/health-information/weight-management/body-weight-planner" target="_blank" rel="noopener">NIDDK · Body Weight Planner ↗</a><br><a href="https://www.nhs.uk/live-well/healthy-weight/managing-your-weight/tips-to-help-you-lose-weight/" target="_blank" rel="noopener">NHS · nachhaltige Gewichtsabnahme ↗</a></p></section><section class="card" style="margin-top:20px"><h2>Deine Messpunkte</h2>${history()}</section>`}
function validateImport(s){if(!s||s.version!==1||!Array.isArray(s.entries)||!s.entries.length||s.entries.length>5000)throw Error();for(let e of s.entries){if(!validDate(e.date)||e.date>today()||!Number.isFinite(e.weight)||e.weight<40||e.weight>250||!Number.isFinite(e.fat)||e.fat<3||e.fat>65||typeof e.note!=='string')throw Error()}for(let k of ['height','target','rate','runDay','runKm','kcal'])if(!Number.isFinite(s[k]))throw Error();if(!validDate(s.anchor)||monday(s.anchor)!==s.anchor||s.height<1.4||s.height>2.2||s.target<70||s.target>94||s.rate<0||s.rate>.75||![5,6].includes(+s.runDay)||s.runKm<5||s.runKm>10||s.kcal<1800||s.kcal>4000)throw Error();for(let k of ['done','logs','tasks'])if(!s[k]||typeof s[k]!=='object'||Array.isArray(s[k]))throw Error();for(let [k,v] of Object.entries(s.logs)){if(k.startsWith('food-')){if(!Array.isArray(v)||v.some(l=>typeof l.name!=='string'||!Number.isFinite(l.kcal)||l.kcal<0||l.kcal>15000||!Number.isFinite(l.p)||l.p<0||l.p>1200))throw Error()}else if(k.startsWith('day-')){if(typeof v!=='string')throw Error()}else if(!v||typeof v.note!=='string'||!Number.isFinite(v.minutes)||v.minutes<0||v.minutes>300)throw Error()}if(!Array.isArray(s.events)||s.events.some(e=>!['ill','plateau','food'].includes(e.type)||!validDate(e.start)||!validDate(e.end)||e.end<e.start))throw Error();if(!Array.isArray(s.photos)||s.photos.some(p=>!validDate(p.date)||!/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(p.src)||! /^[a-zA-Z0-9-]+$/.test(p.id)))throw Error();return s}
function validDate(d){return typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(new Date(d))&&iso(new Date(d+'T12:00:00'))===d}
function resetDialog(){modal(`<h2>Neu beginnen?</h2><p>Alle lokal gespeicherten Daten und Fotos werden durch die Ausgangsbaseline ersetzt. Vorher ein Backup exportieren.</p><div class="actions"><button onclick="exportData()">Backup exportieren</button><button class="danger" onclick="state=structuredClone(initial);save();closeAthleticDialog();render();toast('Auf Baseline zurückgesetzt')">Daten zurücksetzen</button></div>`)}
function render(){page=location.hash.slice(1).split('/')[0]||'overview';if(![...nav.map(n=>n[0]),'settings'].includes(page))page='overview';$('#nav').innerHTML=nav.map(([p,i,t])=>`<a href="#${p}" class="${page===p?'active':''}">${i} &nbsp; ${t}</a>`).join('');$('#app').innerHTML=({overview,training,nutrition,forecast,calendar,story,settings,analytics:()=>window.renderAnalytics?.()||''}[page])();if(page==='settings'){$('#settings').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(monday(f.get('anchor'))!==f.get('anchor'))return toast('Bitte einen Montag als Rotationsstart wählen');for(let k of ['target','runDay','runKm','kcal'])state[k]=+f.get(k);state.height=+f.get('height')/100;state.anchor=f.get('anchor');state.tdee=f.get('tdee')?+f.get('tdee'):null;save();render();toast('Plan gespeichert')};$('#import').onchange=async e=>{try{let file=e.target.files[0];if(!file||file.size>15000000)throw Error();let imported=validateImport(JSON.parse(await file.text()));modal(`<h2>Backup wiederherstellen?</h2><p>${imported.entries.length} Messpunkte und ${imported.photos.length} Fotos ersetzen den aktuellen Stand.</p><button id="confirmImport" class="primary">Daten ersetzen</button>`);$('#confirmImport').onclick=()=>{let old=state;state=imported;if(!save()){state=old;return}closeAthleticDialog();render();toast('Backup wiederhergestellt')}}catch{toast('Ungültiges oder zu großes ATHLETIC-Backup')}}}}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script><script>// Fitness-Schmalle · calmer, larger everyday interface. Existing local data stays intact.
function stepCheckDone(d){return Object.hasOwn(state.stepChecks||{},d)?state.stepChecks[d]:(Number.isFinite(state.steps?.[d])&&state.steps[d]>=state.stepGoal)}
function weeklyStepChecks(){return Array.from({length:7},(_,i)=>add(week,i)).filter(d=>stepCheckDone(d)).length}
let selectedDay=today(),todayOnly=true;
function showTodayDays(){todayOnly=true;week=monday(today());selectedDay=today();render()}
const dayNames=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const dishIds=['chicken-potato','beef-rice','chicken-wrap','vegetable-pan','chili','potato-mince','chicken-curry','wrap-pizza','chicken-pasta','potato-skyr'];
